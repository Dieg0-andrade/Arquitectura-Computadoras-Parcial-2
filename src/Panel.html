<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Roboto, Arial, sans-serif; margin: 0; padding: 12px; color: #263238; font-size: 13px; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .sub { color: #607D8B; font-size: 11px; margin-bottom: 12px; }
    .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    button { border: 1px solid #90A4AE; background: #ECEFF1; border-radius: 4px; padding: 8px 4px;
             font-size: 13px; font-weight: bold; cursor: pointer; color: #263238; }
    button:hover:not(:disabled) { background: #CFD8DC; }
    button:disabled { opacity: .45; cursor: default; }
    button.principal { background: #263238; color: #fff; border-color: #263238; }
    button.pausa { background: #FFD54F; border-color: #FFB300; }
    button.ancho { grid-column: span 2; }
    .control { margin: 8px 0; }
    .control label { display: flex; justify-content: space-between; font-size: 12px; color: #455A64; }
    input[type=range] { width: 100%; }
    .tarjeta { border: 1px solid #CFD8DC; border-radius: 6px; padding: 10px; margin-top: 10px; background: #FAFAFA; }
    .fila { display: flex; justify-content: space-between; margin: 3px 0; gap: 8px; }
    .fila span:first-child { color: #607D8B; white-space: nowrap; }
    .fila span:last-child { font-family: 'Roboto Mono', monospace; text-align: right; }
    .fase { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #FFD54F; font-weight: bold; font-size: 11px; }
    .micro { font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: bold; margin: 8px 0 2px; }
    .detalle { font-family: 'Roboto Mono', monospace; font-size: 11px; color: #546E7A; min-height: 14px; }
    .regs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; text-align: center; }
    .regs div { background: #ECEFF1; border-radius: 4px; padding: 4px; font-family: 'Roboto Mono', monospace; }
    .regs small { display: block; color: #607D8B; font-family: Roboto, Arial, sans-serif; font-size: 10px; }
    .mensaje { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 12px; display: none; white-space: pre-wrap; }
    .mensaje.ok { display: block; background: #E8F5E9; color: #1B5E20; }
    .mensaje.error { display: block; background: #FFCDD2; color: #B71C1C; }
  </style>
</head>
<body>
  <h1>Panel de control</h1>
  <div class="sub">Arquitectura von Neumann · CPU de 8 bits</div>

  <div class="botones">
    <button id="btnCargar" onclick="cargar('panelCargar')" title="Ensambla la columna Ensamblador de la hoja Código">⤓ ENSAMBLAR</button>
    <button id="btnCompilar" onclick="cargar('panelCompilar')" title="Compila la columna Alto nivel de la hoja Código">⚙ COMPILAR</button>
    <button id="btnDemo" onclick="cargar('panelDemo')">★ DEMO ASM</button>
    <button id="btnDemoAlto" onclick="cargar('panelDemoAlto')">★ DEMO ALTO NIVEL</button>
    <button id="btnPaso" onclick="paso()">▶| PASO</button>
    <button id="btnEjecutar" class="principal" onclick="alternarEjecucion()">▶ EJECUTAR</button>
    <button id="btnReiniciar" class="ancho" onclick="reiniciar()">↺ REINICIAR</button>
  </div>

  <div class="control">
    <label><span>Retardo entre pasos</span><span id="valorRetardo">400 ms</span></label>
    <input id="retardo" type="range" min="0" max="2000" step="100" value="400"
           oninput="document.getElementById('valorRetardo').textContent = this.value + ' ms'">
  </div>
  <div class="control">
    <label><span><input id="porInstruccion" type="checkbox"> Avanzar por instrucción completa</span></label>
  </div>

  <div class="tarjeta">
    <div class="fila"><span>Estado</span><span id="estado">—</span></div>
    <div class="fila"><span>Paso (reloj)</span><span id="numPaso">0</span></div>
    <div class="fila"><span>Instrucción</span><span id="instruccion">—</span></div>
    <div style="margin-top:8px"><span class="fase" id="fase">—</span></div>
    <div class="micro" id="descripcion">—</div>
    <div class="detalle" id="detalle"></div>
    <div class="regs">
      <div><small>PC</small><span id="pc">00h</span></div>
      <div><small>AX</small><span id="ax">00h</span></div>
      <div><small>BX</small><span id="bx">00h</span></div>
    </div>
  </div>

  <div id="mensaje" class="mensaje"></div>

  <script>
    let corriendo = false;
    let ocupado = false;

    function el(id) { return document.getElementById(id); }

    function mostrar(r) {
      el('estado').textContent = r.estado;
      el('numPaso').textContent = r.paso;
      el('instruccion').textContent = r.instruccion;
      el('fase').textContent = r.fase;
      el('descripcion').textContent = r.descripcion;
      el('detalle').textContent = r.detalle;
      el('pc').textContent = r.pc;
      el('ax').textContent = r.ax;
      el('bx').textContent = r.bx;
    }

    function mensaje(texto, tipo) {
      const m = el('mensaje');
      m.textContent = texto || '';
      m.className = 'mensaje' + (texto ? ' ' + tipo : '');
    }

    function actualizarBotones() {
      el('btnEjecutar').textContent = corriendo ? '❚❚ PAUSA' : '▶ EJECUTAR';
      el('btnEjecutar').className = corriendo ? 'pausa' : 'principal';
      ['btnCargar', 'btnCompilar', 'btnDemo', 'btnDemoAlto', 'btnPaso', 'btnReiniciar'].forEach(id => { el(id).disabled = corriendo || ocupado; });
      el('btnEjecutar').disabled = ocupado && !corriendo;
    }

    function llamar(funcion, argumento, alTerminar) {
      ocupado = true;
      actualizarBotones();
      google.script.run
        .withSuccessHandler(r => { ocupado = false; alTerminar(r); actualizarBotones(); })
        .withFailureHandler(e => { ocupado = false; corriendo = false; mensaje(e.message, 'error'); actualizarBotones(); })
        [funcion](argumento);
    }

    function paso() {
      mensaje('');
      llamar('panelPaso', el('porInstruccion').checked, r => {
        mostrar(r);
        if (r.detenido) mensaje('CPU detenido (HLT). Usa REINICIAR o vuelve a cargar un programa.', 'ok');
      });
    }

    function alternarEjecucion() {
      if (corriendo) { corriendo = false; actualizarBotones(); mensaje('Ejecución en pausa.', 'ok'); return; }
      mensaje('');
      corriendo = true;
      ciclo();
    }

    function ciclo() {
      if (!corriendo) return;
      llamar('panelPaso', el('porInstruccion').checked, r => {
        mostrar(r);
        if (r.detenido) {
          corriendo = false;
          mensaje('Programa terminado (HLT) en ' + r.paso + ' micro-operaciones.', 'ok');
          return;
        }
        if (corriendo) setTimeout(ciclo, Number(el('retardo').value));
      });
    }

    function reiniciar() {
      mensaje('');
      llamar('panelReiniciar', null, r => { mostrar(r); mensaje('CPU reiniciado.', 'ok'); });
    }

    function cargar(funcion) {
      mensaje('Procesando…', 'ok');
      llamar(funcion, null, r => {
        if (!r.ok) { mensaje(r.mensaje + ':\n' + r.errores.slice(0, 8).join('\n'), 'error'); return; }
        const esperado = funcion.indexOf('Demo') !== -1 ? '\nResultado esperado: res (82h) = 0Fh.' : '';
        mensaje(r.mensaje + esperado, 'ok');
        llamar('panelEstado', null, mostrar);
      });
    }

    llamar('panelEstado', null, mostrar);
  </script>
</body>
</html>
